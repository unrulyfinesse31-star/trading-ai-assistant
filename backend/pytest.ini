import os

os.environ.setdefault("JWT_SECRET", "a-very-long-development-secret-key-123456")
os.environ.setdefault("DATABASE_URL", "sqlite+aiosqlite:///:memory:")

import pytest
from httpx import ASGITransport, AsyncClient

from app.main import PORTFOLIO_STATE, app


@pytest.mark.asyncio
async def test_portfolio_and_simulated_order_flow() -> None:
    PORTFOLIO_STATE["cash"] = 100_000.0
    PORTFOLIO_STATE["positions"] = {}

    client = AsyncClient(transport=ASGITransport(app=app), base_url="http://testserver")
    async with client:
        reg = await client.post("/auth/register", json={"username": "paper-user", "password": "secure-pass-123"})
        assert reg.status_code == 200, reg.text

        login = await client.post("/auth/login", json={"username": "paper-user", "password": "secure-pass-123"})
        assert login.status_code == 200, login.text
        token = login.json()["token"]

        portfolio = await client.get("/portfolio", headers={"Authorization": f"Bearer {token}"})
        assert portfolio.status_code == 200, portfolio.text
        assert portfolio.json()["cash"] == 100000.0

        order = await client.post(
            "/portfolio/order",
            json={"symbol": "AAPL", "side": "buy", "quantity": 10, "price": 200.0},
            headers={"Authorization": f"Bearer {token}"},
        )
        assert order.status_code == 200, order.text
        body = order.json()
        assert body["symbol"] == "AAPL"
        assert body["status"] == "simulated"

        portfolio_after = await client.get("/portfolio", headers={"Authorization": f"Bearer {token}"})
        assert portfolio_after.status_code == 200, portfolio_after.text
        assert portfolio_after.json()["positions"][0]["symbol"] == "AAPL"
        assert portfolio_after.json()["positions"][0]["quantity"] == 10

        sell = await client.post(
            "/portfolio/order",
            json={"symbol": "AAPL", "side": "sell", "quantity": 5, "price": 210.0},
            headers={"Authorization": f"Bearer {token}"},
        )
        assert sell.status_code == 200, sell.text
        assert sell.json()["symbol"] == "AAPL"

        final_portfolio = await client.get("/portfolio", headers={"Authorization": f"Bearer {token}"})
        assert final_portfolio.status_code == 200, final_portfolio.text
        assert final_portfolio.json()["positions"][0]["quantity"] == 5
